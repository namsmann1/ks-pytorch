[project]
name = "pytorch-101"
version = "0.1.0"
description = "A hands-on introduction to PyTorch for students"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5,<3",
    "numpy>=2,<3",
    "matplotlib>=3.9,<4",
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.3,<5",
]

[tool.ruff]
line-length = 150

[tool.uv]
package = false

# Use CPU wheels on Linux and Windows; macOS uses the standard PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
