[project]
name = "pytorch-101"
version = "0.1.0"
description = "A hands-on introduction to PyTorch for students"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2.5.4",
    "jupyterlab>=4.6.4",
    "ipykernel>=7.4.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[tool.ruff]
line-length = 150

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
